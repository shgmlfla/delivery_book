services:
  db:
    image: postgres:16.2
    container_name: dbook-db
    restart: unless-stopped
    environment:
      - POSTGRES_DB=dbook
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - dbook-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d dbook" ]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    image: ${DOCKER_USERNAME}/dbook:latest
    container_name: dbook-app
    restart: unless-stopped
    depends_on:
      - db:
          condition : service_healthy
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:postgresql://dbook-db:5432/dbook
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=none
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}    
      - BOOK_API_KEY=${BOOK_API_KEY}
      - TOSS_PAYMENT_CLIENT_KEY=${TOSS_PAYMENT_CLIENT_KEY}
      - TOSS_PAYMENT_SECRET_KEY=${TOSS_PAYMENT_SECRET_KEY}
    ports:
      - "8080:8080"
    networks:
      - dbook-network

volumes:
  db_data: {}

networks:
  dbook-network:
    driver: bridge